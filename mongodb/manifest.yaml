apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-dp
  namespace: roboshop
  labels:
    project: roboshop
    component: mongodb
    tier: db
    environment: development
spec:
  replicas: 1
  selector:
    matchLabels:
      project: roboshop
      component: mongodb
      tier: db
      environment: development
  template:
    metadata:
      labels:
        project: roboshop
        component: mongodb
        tier: db
        environment: development
    spec:
      containers:
      - name: mongodb
        image: 9959087127/mongodb:v1
        readinessProbe:
          httpGet:
            path: /health
            port: 27017
          failureThreshold: 1
          periodSeconds: 15
        livenessProbe:
          httpGet:
            path: /health
            port: 27017
          failureThreshold: 1
          periodSeconds: 15

---

apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: roboshop
spec:
  selector:
    project: roboshop
    component: mongodb
    tier: db
    environment: development
  ports:
  - protocol: TCP
    port: 27010 # service port
    targetPort: 27017   #container port