apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-dp
  namespace: roboshop
  labels:
    project: roboshop
    component: mongodb
    tier: db
    environment: development
spec:
  replicas: 1
  selector:
    matchLabels:
      project: roboshop
      component: mongodb
      tier: db
      environment: development
  template:
    metadata:
      labels:
        project: roboshop
        component: mongodb
        tier: db
        environment: development
    spec:
      containers:
      - name: mongodb
        image: 9959087127/mongodb:v1
        imagePullPolicy: Always
        readinessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 10
          periodSeconds: 10

---

apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: roboshop
spec:
  selector:
    project: roboshop
    component: mongodb
    tier: db
    environment: development
  ports:
  - protocol: TCP
    port: 6379 # service port
    targetPort: 6379   #container port