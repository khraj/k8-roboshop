apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-dp
  labels:
    project: roboshop
    component: mongodb
    tier: db
    environment: development
spec:
  replicas: 1
  selector:
    matchLabels:
      project: roboshop
      component: mongodb
      tier: db
      environment: development
  template:
    metadata:
      labels:
        project: roboshop
        component: mongodb
        tier: db
        environment: development
    spec:
      containers:
      - name: mongodb
        image: 9959087127/mongodb:v1