apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-dp
  namespace: roboshop
  labels:
    project: roboshop
    component: redis
    tier: db
    environment: development
spec:
  replicas: 1
  selector:
    matchLabels:
      project: roboshop
      component: redis
      tier: db
      environment: development
  template:
    metadata:
      labels:
        project: roboshop
        component: redis
        tier: db
        environment: development
    spec:
      containers:
      - name: redis
        image: redis:7
        imagePullPolicy: Always
        readinessProbe:
          httpGet:
            path: /health
            port: 6379
          failureThreshold: 1
          periodSeconds: 15
        livenessProbe:
          httpGet:
            path: /health
            port: 6379
          failureThreshold: 1
          periodSeconds: 15

---

apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: roboshop
spec:
  selector:
    project: roboshop
    component: redis
    tier: db
    environment: development
  ports:
  - protocol: TCP
    port: 27010 # service port
    targetPort: 27017   #container port